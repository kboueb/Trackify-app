# Release : à chaque tag v* (ex. v0.2.0), build macOS (universel) et Windows, puis release GitHub publiée
# avec les installeurs et `latest.json`, que l'app consulte pour proposer la mise à jour.
#
# Secrets requis (Settings › Secrets and variables › Actions) :
# - TAURI_SIGNING_PRIVATE_KEY : contenu de ~/.tauri/trackify.key
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD : contenu de ~/.tauri/trackify.key.password
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Trackify ${{ github.ref_name }}
          releaseBody: Pour mettre à jour, accepte la proposition de Trackify ou va dans Réglages › À propos.
          releaseDraft: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

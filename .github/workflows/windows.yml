# Build Windows : tests puis installeurs (.msi et .exe NSIS).
# - À chaque push sur main : les installeurs sont téléchargeables dans l'onglet Actions (artefact « trackify-windows »).
# - Sur un tag v* (ex. v0.2.0) : ils sont aussi joints à une release GitHub en brouillon.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Deux étapes : sous PowerShell, l'échec d'une commande au milieu d'un bloc passerait inaperçu.
      - name: Tests Rust
        run: cargo test --workspace

      - name: Tests frontend
        run: npm test

      - name: Installeurs
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: trackify-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

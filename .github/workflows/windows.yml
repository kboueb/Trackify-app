# Build Windows : tests puis installeurs (.msi et .exe NSIS), à chaque push sur main.
# Les installeurs sont téléchargeables dans l'onglet Actions (artefact « trackify-windows »).
# Les versions publiées (tags v*) passent par release.yml.
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Deux étapes : sous PowerShell, l'échec d'une commande au milieu d'un bloc passerait inaperçu.
      - name: Tests Rust
        run: cargo test --workspace

      - name: Tests frontend
        run: npm test

      - name: Installeurs
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: trackify-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
